# Cuando el Estudio (o vos) cambia la galería en data/, GitHub vuelve a generar
# las páginas con tools/build.py y las publica solas.
name: Generar páginas
on:
  push:
    branches: [main]
    paths: ["data/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generar-paginas
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Generar páginas
        run: python3 tools/build.py
      - name: Guardar y publicar
        run: |
          git config user.name "Estudio juanguzmanph"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Páginas generadas desde el Estudio"
          git pull --rebase origin main
          git push origin HEAD:main
